# Publishes to PyPI when a tag v* is pushed. Requires PyPI "trusted publishing" to be configured for
# this repository (PyPI project -> Publishing -> GitHub, workflow release.yml, environment pypi).
name: release
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine && python -m build && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
