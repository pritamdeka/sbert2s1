[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbert2s1"
version = "0.1.0"
description = "Calibrated, single-pass typed decisions (choice / score / yes-no) from biomedical sentence encoders"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Pritam Deka" }]
keywords = ["biomedical NLP", "sentence-transformers", "decision models", "calibration", "System One",
            "classification", "PubMedBERT"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sbert2s1 = "sbert2s1.cli:main"

[project.urls]
Homepage = "https://github.com/pritamdeka/sbert2s1"
Repository = "https://github.com/pritamdeka/sbert2s1"
Issues = "https://github.com/pritamdeka/sbert2s1/issues"
Model = "https://huggingface.co/pritamdeka/S1-PubMedBERT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sbert2s1 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
